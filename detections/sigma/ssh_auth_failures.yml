title: SSH Authentication Failure
description: Base event rule for failed SSH authentication. Intended for correlation into repeated-failure and password-spraying analytics.
status: test
logsource:
  product: linux
  service: sshd
detection:
  selection:
    event_type: authentication_failure
    destination_port: 22
  condition: selection
falsepositives:
  - Normal user authentication mistakes
  - Expired credentials
  - Approved security testing
level: low
tags:
  - attack.credential_access
  - attack.t1110
custom:
  rule_id: AUTH-BASE-001
  analytic_type: authentication_failure
