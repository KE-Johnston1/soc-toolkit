title: SSH Password Spraying Correlation
description: Correlate repeated SSH authentication failures from one source across multiple accounts. Requires analyst validation of source ownership and successful authentication context.
status: test
correlation:
  type: event_count
  rules:
    - ssh_auth_failures
  group-by:
    - source_ip
  timespan: 5m
  condition:
    gte: 5
  generate:
    - attack.t1110.003
    - AUTH-REPEAT-001
falsepositives:
  - Authorised vulnerability scanners
  - Shared NAT or proxy infrastructure
  - Misconfigured automation
  - Approved penetration testing
level: medium
tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.003
custom:
  rule_id: AUTH-REPEAT-001
  analytic_type: password_spraying
  required_context: multiple_target_accounts
  note: The correlation identifies a source-wide failure burst. The implementation must additionally verify that multiple distinct accounts are involved before classifying it as password spraying.
