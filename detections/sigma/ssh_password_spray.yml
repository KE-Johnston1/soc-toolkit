title: SSH Password Spraying Investigation Lead
description: Detect repeated SSH authentication failures from one source across multiple accounts within a short window. This is an investigation lead, not proof of compromise.
status: test
logsource:
  product: linux
  service: sshd
detection:
  selection:
    event_type: authentication_failure
    destination_port: 22
  timeframe: 5m
  condition: selection | count(source_ip) by source_ip > 4 and count(account) by source_ip > 1
falsepositives:
  - Authorised vulnerability scanners
  - NAT gateways or shared egress infrastructure
  - Misconfigured automation or service accounts
  - Approved penetration testing
level: medium
tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.003
custom:
  rule_id: AUTH-REPEAT-001
  analytic_type: password_spraying
  confidence: medium
  analyst_note: Validate source ownership, successful authentication, endpoint activity, and authorisation before escalation.
